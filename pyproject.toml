[project]
  dependencies = [
    "advent-of-code-data[nb]>=2.2.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "numpy>=2.5.4",
    "tqdm>=4.70.1",
  ]
  description = "My advent of code solutions"
  license = "MIT"
  license-files = ["LICENSE"]
  name = "advent-of-code"
  readme = "README.md"
  requires-python = ">=3.13"
  version = "0.1.0"

[build-system]
  build-backend = "uv_build"
  requires      = ["uv_build>=0.13.4,<0.14.0"]

[dependency-groups]
  2015 = [
    "jq>=1.12.0",
    "networkx>=3.7",
    "scipy>=1.18.1",
]
  2025 = ["pandas>=3.0.6", "scipy>=1.18.1", "seaborn>=0.13.2", "shapely>=2.2.0"]
  dev  = ["prek>=0.5.7", "pytest>=8.3.0", "ruff>=0.17.0", "ty>=0.0.87"]

[tool.ruff]
  fix            = true
  line-length    = 120
  target-version = "py314"

  [tool.ruff.lint]
    fixable = ["ALL"]
    select  = ["ALL"]

    ignore = [
      # Prevent conflicts with formatter (see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules)
      "ANN204", # missing-return-type-special-method
      "COM812", # missing-trailing-comma
      "COM819", # prohibited-trailing-comma
      "E111",   # indentation-with-invalid-multiple
      "E114",   # indentation-with-invalid-multiple-comment
      "E117",   # over-indented
      "Q",      # flake8-quotes
      "W191",   # tab-indentation

      # Overly strict rules
      "D105", # undocumented-magic-method (magic methods are often self-explanatory)
      "D107", # undocumented-public-init (__init__ methods are often self-explanatory)

      # Project-specific ignores
      "CPY001", # puzzle solutions carry no copyright header; LICENSE covers the repo
      "S101", # assert is used for checking example solutions
      "S311", # no cryptographic randomness needed for AoC
      "T201", # print is used for showing results
    ]

    [tool.ruff.lint.pydocstyle]
      convention = "google"

    [tool.ruff.lint.pylint]
      allow-magic-value-types = ["int", "str"]
      max-args                = 10

  [tool.ruff.lint.per-file-ignores]
    # Docstrings and magic values are fine in tests; tests are not an importable package.
    "tests/*" = ["D100", "D103", "INP001", "PLR2004"]
    # The day template is scaffolding: unfinished stubs and TODO markers are expected.
    "notebooks/templates/*" = ["ARG001", "FIX002", "TD002", "TD003"]

[tool.ty.environment]
  python-version = "3.14"

[tool.ty.src]
  include = ["src", "tests"]

[tool.pytest.ini_options]
  testpaths = ["tests"]

[tool.uv.build-backend]
  module-name = "aoc_utils"
